storageClass: lab-gp3
catalogSeed: false
labRbac: false
telemetryRbac: true
pvcs:
  prometheus: 2Gi
configMaps:
  collector:
    config.yaml: |
      exporters:
        debug:
          verbosity: basic
        otlp/jaeger:
          endpoint: jaeger:4317
          tls:
            insecure: true
        prometheus:
          endpoint: 0.0.0.0:8889
          resource_to_telemetry_conversion:
            enabled: true
      extensions:
        health_check:
          endpoint: 0.0.0.0:13133
      processors:
        batch: {}
        memory_limiter:
          check_interval: 1s
          limit_mib: 350
          spike_limit_mib: 80
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
      service:
        extensions:
        - health_check
        pipelines:
          logs:
            exporters:
            - debug
            processors:
            - memory_limiter
            - batch
            receivers:
            - otlp
          metrics:
            exporters:
            - prometheus
            processors:
            - memory_limiter
            - batch
            receivers:
            - otlp
          traces:
            exporters:
            - otlp/jaeger
            processors:
            - memory_limiter
            - batch
            receivers:
            - otlp
  jaeger:
    config.yaml: |
      exporters:
        jaeger_storage_exporter:
          trace_storage: memory_backend
      extensions:
        jaeger_query:
          storage:
            traces: memory_backend
        jaeger_storage:
          backends:
            memory_backend:
              memory:
                max_traces: 10000
      processors:
        batch: {}
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
      service:
        extensions:
        - jaeger_storage
        - jaeger_query
        pipelines:
          traces:
            exporters:
            - jaeger_storage_exporter
            processors:
            - batch
            receivers:
            - otlp
  prometheus:
    config.yaml: |
      global:
        evaluation_interval: 10s
        scrape_interval: 10s
      scrape_configs:
      - job_name: web
        static_configs:
        - targets:
          - web.lab-app:8080
      - job_name: otel
        static_configs:
        - targets:
          - otel-collector:8889
      - job_name: kube-state
        static_configs:
        - targets:
          - kube-state-metrics:8080
  grafana-datasources:
    datasources.yaml: |
      apiVersion: 1
      datasources:
      - isDefault: true
        name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus:9090
      - name: Jaeger
        type: jaeger
        uid: jaeger
        url: http://jaeger:16686
  grafana-providers:
    providers.yaml: |
      apiVersion: 1
      providers:
      - name: lab
        options:
          path: /dashboards
  grafana-dashboards:
    lab.json: |-
      {
        "title": "AIOps Lab · Demo & Service Health",
        "uid": "lab-health",
        "schemaVersion": 39,
        "version": 2,
        "refresh": "5s",
        "time": {
          "from": "now-15m",
          "to": "now"
        },
        "timezone": "browser",
        "editable": false,
        "tags": [
          "aiops",
          "demo"
        ],
        "links": [
          {
            "title": "Mở Web · thử giỏ hàng",
            "url": "http://localhost:18081",
            "type": "link",
            "targetBlank": true
          },
          {
            "title": "Jaeger · tìm trace lỗi",
            "url": "http://localhost:16686",
            "type": "link",
            "targetBlank": true
          }
        ],
        "panels": [
          {
            "id": 1,
            "title": "BẮT ĐẦU Ở ĐÂY · Đọc từ trái sang phải",
            "type": "text",
            "gridPos": {
              "x": 0,
