              "mode": "markdown",
              "content": "### Traffic tự động → Web → Catalog / Cart → PostgreSQL / Valkey\n**Có sẵn 1 load-generator:** mỗi vòng tối đa 10 request, nghỉ 3 giây; RPS không cố định. **F02:** xem sản phẩm vẫn được, giỏ hàng lỗi; Pod có thể vẫn xanh.\n\n**Đọc demo:** quan sát bình thường → bơm lỗi → đợi 30–60 giây → xem ô lỗi và trace → sửa/reset → xác nhận phục hồi. Số liệu HTTP dùng cửa sổ 1 phút, nên sau sửa cần khoảng 1 phút để lỗi cũ trôi hết. Màu xám / CHƯA CÓ DỮ LIỆU không có nghĩa hệ thống tốt."
