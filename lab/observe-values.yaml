                "legendFormat": "Thành công · 2xx/3xx",
                "range": true,
                "instant": false
              },
              {
                "refId": "B",
                "expr": "(sum(rate(lab_http_requests_total{route=~\"/api/.*|/images/.*\",status=~\"5..\"}[1m])) or (sum(rate(lab_http_requests_total{route=~\"/api/.*|/images/.*\"}[1m])) * 0)) and on() (up{job=\"web\"} == 1)",
                "legendFormat": "Lỗi máy chủ · 5xx",
                "range": true,
                "instant": false
              },
              {
                "refId": "C",
                "expr": "(sum(rate(lab_http_requests_total{route=~\"/api/.*|/images/.*\",status=~\"4..\"}[1m])) or (sum(rate(lab_http_requests_total{route=~\"/api/.*|/images/.*\"}[1m])) * 0)) and on() (up{job=\"web\"} == 1)",
                "legendFormat": "Lỗi yêu cầu · 4xx",
                "range": true,
                "instant": false
              }
            ]
          },
          {
            "id": 12,
            "title": "Thao tác nào đang lỗi? · % HTTP 5xx",
            "type": "timeseries",
            "gridPos": {
              "x": 12,
              "y": 12,
              "w": 12,
              "h": 8
            },
            "description": "",
            "fieldConfig": {
              "defaults": {
                "unit": "percent",
                "noValue": "CHƯA CÓ DỮ LIỆU",
                "color": {
                  "mode": "palette-classic"
                },
                "custom": {
                  "drawStyle": "line",
                  "lineWidth": 2,
                  "fillOpacity": 12,
                  "spanNulls": false
                },
                "min": 0,
                "max": 100
              },
              "overrides": []
            },
            "options": {
              "tooltip": {
                "mode": "multi",
                "sort": "desc"
              },
              "legend": {
                "displayMode": "table",
                "placement": "bottom",
                "calcs": [
                  "lastNotNull",
                  "max"
                ]
              }
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "targets": [
              {
                "refId": "A",
                "expr": "100 * (sum by(route)(rate(lab_http_requests_total{route=~\"/api/.*|/images/.*\",status=~\"5..\"}[1m])) or (sum by(route)(rate(lab_http_requests_total{route=~\"/api/.*|/images/.*\"}[1m])) * 0)) / (sum by(route)(rate(lab_http_requests_total{route=~\"/api/.*|/images/.*\"}[1m])) > 0) and on() (up{job=\"web\"} == 1)",
                "legendFormat": "{{route}}",
                "range": true,
                "instant": false
              }
            ]
          },
          {
            "id": 13,
            "title": "Độ trễ P95 theo thao tác · thấp hơn là tốt hơn",
            "type": "timeseries",
            "gridPos": {
              "x": 0,
              "y": 20,
              "w": 12,
              "h": 8
            },
            "description": "P95 ước lượng từ histogram của request đã hoàn tất. Web ngừng phản hồi có thể không có mẫu; không diễn giải khoảng trống là nhanh.",
            "fieldConfig": {
              "defaults": {
                "unit": "s",
                "noValue": "CHƯA CÓ DỮ LIỆU",
                "color": {
                  "mode": "palette-classic"
                },
                "custom": {
                  "drawStyle": "line",
                  "lineWidth": 2,
                  "fillOpacity": 12,
                  "spanNulls": false
                }
              },
              "overrides": []
            },
            "options": {
              "tooltip": {
                "mode": "multi",
                "sort": "desc"
              },
              "legend": {
                "displayMode": "table",
                "placement": "bottom",
                "calcs": [
                  "lastNotNull",
                  "max"
                ]
              }
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "targets": [
              {
                "refId": "A",
                "expr": "histogram_quantile(0.95, sum by(le,route)(rate(lab_http_request_seconds_bucket{route=~\"/api/.*|/images/.*\"}[1m]))) and on() (up{job=\"web\"} == 1)",
                "legendFormat": "{{route}}",
                "range": true,
                "instant": false
              }
            ]
          },
          {
            "id": 14,
            "title": "Pod sẵn sàng theo dịch vụ · tối thiểu 1 mỗi dịch vụ",
            "type": "bargauge",
            "gridPos": {
              "x": 12,
              "y": 20,
              "w": 12,
              "h": 8
            },
            "description": "0 màu đỏ, kể cả khi replicas mong muốn bị scale về 0 (F08). Pod xanh vẫn có thể sai địa chỉ Valkey/PostgreSQL.",
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "noValue": "CHƯA CÓ DỮ LIỆU",
                "color": {
                  "mode": "thresholds"
                },
                "custom": {},
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "value": null,
                      "color": "red"
                    },
                    {
                      "value": 1,
                      "color": "green"
                    }
                  ]
                },
                "min": 0,
                "max": 2,
                "decimals": 0
              },
              "overrides": []
            },
            "options": {
              "orientation": "horizontal",
              "displayMode": "basic",
              "showUnfilled": true,
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "values": false,
                "fields": ""
              }
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "targets": [
              {
                "refId": "A",
                "expr": "kube_deployment_status_replicas_available{namespace=\"lab-app\"} and on() (up{job=\"kube-state\"} == 1)",
                "legendFormat": "{{deployment}}",
                "range": false,
                "instant": true
              }
            ]
          },
          {
            "id": 15,
            "title": "Lịch sử Pod sẵn sàng · tìm thời điểm tụt về 0",
            "type": "timeseries",
            "gridPos": {
              "x": 0,
              "y": 28,
              "w": 12,
              "h": 8
            },
            "description": "Dùng cùng trục thời gian với HTTP để so sánh trước lỗi, trong lỗi và sau phục hồi.",
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "noValue": "CHƯA CÓ DỮ LIỆU",
                "color": {
                  "mode": "palette-classic"
                },
                "custom": {
                  "drawStyle": "line",
                  "lineWidth": 2,
                  "fillOpacity": 12,
                  "spanNulls": false
                }
              },
              "overrides": []
            },
            "options": {
              "tooltip": {
                "mode": "multi",
                "sort": "desc"
              },
              "legend": {
                "displayMode": "table",
                "placement": "bottom",
                "calcs": [
                  "lastNotNull",
                  "max"
                ]
              }
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "targets": [
              {
                "refId": "A",
                "expr": "kube_deployment_status_replicas_available{namespace=\"lab-app\",deployment=~\"web|cart|catalog|valkey|postgresql\"} and on() (up{job=\"kube-state\"} == 1)",
                "legendFormat": "{{deployment}}",
                "range": true,
                "instant": false
              }
            ]
          },
          {
            "id": 16,
            "title": "Container restart trong 5 phút",
            "type": "timeseries",
            "gridPos": {
              "x": 12,
              "y": 28,
              "w": 12,
              "h": 8
            },
            "description": "Tăng khi container restart trong cùng Pod. Thay thế/xóa Pod không được tính như restart của Pod cũ.",
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "noValue": "CHƯA CÓ DỮ LIỆU",
                "color": {
                  "mode": "palette-classic"
                },
                "custom": {
                  "drawStyle": "line",
                  "lineWidth": 2,
                  "fillOpacity": 12,
                  "spanNulls": false
                },
                "min": 0
              },
              "overrides": []
            },
            "options": {
              "tooltip": {
                "mode": "multi",
                "sort": "desc"
              },
              "legend": {
                "displayMode": "table",
                "placement": "bottom",
                "calcs": [
                  "lastNotNull",
                  "max"
                ]
              }
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "targets": [
              {
                "refId": "A",
                "expr": "sum by(container)(increase(kube_pod_container_status_restarts_total{namespace=\"lab-app\"}[5m])) and on() (up{job=\"kube-state\"} == 1)",
                "legendFormat": "{{container}}",
                "range": true,
                "instant": false
              }
            ]
          },
          {
            "id": 17,
            "title": "Pod đang chờ · lý do hiện tại",
            "type": "table",
            "gridPos": {
              "x": 0,
              "y": 36,
              "w": 12,
              "h": 7
            },
            "description": "Không có dòng: không thấy container đang chờ, nếu ô thu thập Kubernetes phía trên còn xanh. Đây không phải kiểm tra lỗi nghiệp vụ.",
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "noValue": "CHƯA CÓ DỮ LIỆU",
                "color": {
                  "mode": "palette-classic"
                },
                "custom": {}
              },
              "overrides": []
            },
            "options": {},
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "targets": [
              {
                "refId": "A",
                "expr": "(kube_pod_container_status_waiting_reason{namespace=\"lab-app\"} == 1) and on() (up{job=\"kube-state\"} == 1)",
                "legendFormat": "",
                "range": false,
                "instant": true,
                "format": "table"
              }
            ],
            "transformations": [
              {
                "id": "organize",
                "options": {
                  "excludeByName": {
                    "Time": true,
                    "__name__": true,
                    "instance": true,
                    "job": true,
                    "namespace": true,
                    "uid": true,
                    "Value": true
                  },
                  "renameByName": {
                    "pod": "Pod",
                    "container": "Container",
                    "reason": "Lý do"
                  }
                }
              }
            ]
          },
          {
            "id": 18,
            "title": "Lần kết thúc container gần nhất · bằng chứng OOM",
            "type": "table",
            "gridPos": {
              "x": 12,
              "y": 36,
              "w": 12,
              "h": 7
            },
            "description": "Đây là sự kiện gần nhất của Pod còn tồn tại, không khẳng định lỗi vẫn đang tiếp diễn. OOMKilled giúp investigate F07.",
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "noValue": "CHƯA CÓ DỮ LIỆU",
                "color": {
                  "mode": "palette-classic"
                },
                "custom": {}
              },
              "overrides": []
            },
            "options": {},
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "targets": [
              {
                "refId": "A",
                "expr": "(kube_pod_container_status_last_terminated_reason{namespace=\"lab-app\"} == 1) and on() (up{job=\"kube-state\"} == 1)",
                "legendFormat": "",
                "range": false,
                "instant": true,
                "format": "table"
              }
            ],
            "transformations": [
              {
                "id": "organize",
                "options": {
                  "excludeByName": {
                    "Time": true,
                    "__name__": true,
                    "instance": true,
                    "job": true,
                    "namespace": true,
                    "uid": true,
                    "Value": true
                  },
                  "renameByName": {
                    "pod": "Pod",
                    "container": "Container",
                    "reason": "Lý do"
                  }
                }
              }
            ]
          },
          {
            "id": 19,
            "title": "HƯỚNG DẪN DEMO · Triệu chứng → điều tra → sửa → xác nhận",
            "type": "text",
            "gridPos": {
              "x": 0,
              "y": 43,
              "w": 24,
              "h": 6
            },
            "description": "",
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "noValue": "CHƯA CÓ DỮ LIỆU",
                "color": {
                  "mode": "palette-classic"
                },
                "custom": {}
              },
              "overrides": []
            },
            "options": {
              "mode": "markdown",
              "content": "| Tình huống | Dấu hiệu cần nhìn | Điều tra tiếp |\n|---|---|---|\n| F01 / F02 · Cart không kết nối được | Giỏ hàng đỏ; catalog vẫn có thể xanh; Pod có thể vẫn Ready | Jaeger service `web` / `cart`, log Cart, Service và endpoint |\n| F03 · Catalog mất PostgreSQL | Xem sản phẩm đỏ; giỏ hàng có thể thiếu mẫu vì hành trình dừng sớm | Trace Catalog, log và cấu hình DB |\n| F04 / F07 / F08 · Cart không sẵn sàng | Cart 0 Pod Ready; ImagePull / OOM / replicas 0 | Bảng lý do, Pod events và Deployment |\n| F05 / F06 · Web crash / probe sai | Web mất kết nối metric, HTTP thiếu dữ liệu, Web 0 Pod Ready | Pod events, log và readiness probe |\n\n**Khôi phục operator:** `python lab/tools/faults.py reset --context capstone-aiops-lab` trong repo, với kubeconfig operator. **Demo AI:** giữ lỗi để agent investigate → đề xuất runbook → người duyệt → executor sửa → traffic xác nhận. Dashboard chỉ phản ánh telemetry; không đọc mã lỗi inject hay tự suy đoán nguyên nhân gốc."
            }
          }
        ]
      }
workloads:
  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.142.0
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 512Mi
    ports:
    - name: service
      containerPort: 4317
    - name: otlp-http
      containerPort: 4318
    - name: metrics
      containerPort: 8889
    args:
    - --config=/conf/config.yaml
    readinessProbe:
      httpGet:
        path: /
        port: 13133
    volumeMounts:
    - name: config
      mountPath: /conf
    volumes:
    - name: config
      configMap:
        name: collector
  jaeger:
    image: jaegertracing/jaeger:2.12.0
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 512Mi
    ports:
    - name: service
      containerPort: 16686
    - name: otlp
      containerPort: 4317
    args:
    - --config=/conf/config.yaml
    volumeMounts:
    - name: config
      mountPath: /conf
    volumes:
    - name: config
      configMap:
        name: jaeger
  prometheus:
    image: quay.io/prometheus/prometheus:v3.8.1
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 768Mi
    ports:
    - name: service
      containerPort: 9090
    args:
    - --config.file=/conf/config.yaml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=2d
    - --storage.tsdb.retention.size=1GB
    podSecurityContext:
      fsGroup: 65534
    readinessProbe:
      httpGet:
        path: /-/ready
        port: 9090
    volumeMounts:
    - name: config
      mountPath: /conf
    - name: data
      mountPath: /prometheus
    volumes:
    - name: config
      configMap:
        name: prometheus
    - name: data
      persistentVolumeClaim:
        claimName: prometheus
  grafana:
    image: grafana/grafana:12.3.1
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    ports:
    - name: service
      containerPort: 3000
    env:
    - name: GF_AUTH_ANONYMOUS_ENABLED
      value: 'true'
    - name: GF_AUTH_ANONYMOUS_ORG_ROLE
      value: Viewer
    - name: GF_USERS_ALLOW_SIGN_UP
      value: 'false'
    - name: GF_SECURITY_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: grafana-admin
          key: password
    podSecurityContext:
      fsGroup: 472
    volumeMounts:
    - name: datasources
      mountPath: /etc/grafana/provisioning/datasources
    - name: providers
      mountPath: /etc/grafana/provisioning/dashboards
    - name: dashboards
      mountPath: /dashboards
    - name: data
      mountPath: /var/lib/grafana
    volumes:
    - name: datasources
      configMap:
        name: grafana-datasources
    - name: providers
      configMap:
        name: grafana-providers
    - name: dashboards
      configMap:
        name: grafana-dashboards
    - name: data
      emptyDir: {}
