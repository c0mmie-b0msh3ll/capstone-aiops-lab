apiVersion: v1
kind: ServiceAccount
metadata: {name: kube-state-metrics, namespace: lab-observe}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: kube-state-metrics, namespace: lab-app}
rules:
  - apiGroups: [""]
    resources: [pods, services]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: kube-state-metrics, namespace: lab-app}
subjects: [{kind: ServiceAccount, name: kube-state-metrics, namespace: lab-observe}]
roleRef: {kind: Role, name: kube-state-metrics, apiGroup: rbac.authorization.k8s.io}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kube-state-metrics, namespace: lab-observe}
spec:
  replicas: 1
  selector: {matchLabels: {app: kube-state-metrics}}
  template:
    metadata: {labels: {app: kube-state-metrics}}
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.17.0
          args: ["--namespaces=lab-app", "--resources=pods,services,deployments,replicasets"]
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 30m, memory: 40Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata: {name: kube-state-metrics, namespace: lab-observe}
spec:
  selector: {app: kube-state-metrics}
  ports: [{port: 8080, targetPort: 8080}]
